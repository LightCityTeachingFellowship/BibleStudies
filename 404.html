{% if site.baseurl == '' %}
<script>
// Preserve shared links that still contain the former GitHub project prefix.
if (location.pathname === '/BibleStudies' || location.pathname.startsWith('/BibleStudies/')) {
  const destination = new URL(location.href);
  destination.pathname = location.pathname.slice('/BibleStudies'.length) || '/Home/';
  if (destination.pathname === '/') destination.pathname = '/Home/';
  location.replace(destination.href);
}
</script>
{% endif %}
