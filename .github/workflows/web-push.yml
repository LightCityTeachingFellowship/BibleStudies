name: Notify web subscribers
on:
  workflow_run:
    workflows: ["pages-build-deployment", "pages build and deployment"]
    types: [completed]
    branches: [master]
  workflow_dispatch:
    inputs:
      operation:
        description: 'Validate, record baseline, or test one subscription'
        type: choice
        options: [validate, baseline, test, test-basic]
        default: validate
      subscriber_id:
        description: 'For test only: document ID in Firestore webPushSubscribers (not token)'
        type: string
        required: false
      video_id:
        description: 'Optional for test: YouTube video ID to preview its real title and thumbnail'
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: lightcity-web-push
  cancel-in-progress: false
jobs:
  notify:
    if: ${{ github.event_name == 'workflow_dispatch' || (vars.WEB_PUSH_ENABLED == 'true' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'master') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --omit=dev
        working-directory: tools/push
      - run: npm run send
        working-directory: tools/push
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.operation == 'validate' }}
          BASELINE_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.operation == 'baseline' }}
          TEST_MODE: ${{ github.event_name == 'workflow_dispatch' && (inputs.operation == 'test' || inputs.operation == 'test-basic') }}
          TEST_BASIC: ${{ github.event_name == 'workflow_dispatch' && inputs.operation == 'test-basic' }}
          TEST_SUBSCRIBER_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.subscriber_id || '' }}
          TEST_VIDEO_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.video_id || '' }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
