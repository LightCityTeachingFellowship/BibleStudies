name: Notify web subscribers
on:
  workflow_run:
    workflows: ["pages-build-deployment", "pages build and deployment"]
    types: [completed]
    branches: [master]
  workflow_dispatch:
    inputs:
      operation:
        description: 'Validate, record baseline, or test one subscription'
        type: choice
        options: [validate, baseline, test, test-basic, sync-members]
        default: validate
      subscriber_id:
        description: 'For test only: document ID in Firestore webPushSubscribers (not token)'
        type: string
        required: false
      video_id:
        description: 'Optional for test: YouTube video ID to preview its real title and thumbnail'
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: lightcity-web-push
  cancel-in-progress: false
jobs:
  notify:
    if: ${{ vars.AUDIO_READY_PUBLISHING != 'true' && (github.event_name == 'workflow_dispatch' || ((vars.WEB_PUSH_ENABLED == 'true' || vars.CHURCH_MEMBERS_ENABLED == 'true') && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'master')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || 'master' }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --omit=dev
        working-directory: tools/push
      - id: sync_library
        name: Detect replacements and update the protected video library
        if: ${{ (vars.CHURCH_MEMBERS_ENABLED == 'true' || vars.WEB_PUSH_ENABLED == 'true') && (github.event_name == 'workflow_run' || inputs.operation == 'sync-members') }}
        run: node sync-members.mjs
        working-directory: tools/push
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - run: npm run send
        if: ${{ steps.sync_library.outputs.skipped != 'true' && ((github.event_name == 'workflow_dispatch' && inputs.operation != 'sync-members') || (github.event_name == 'workflow_run' && vars.WEB_PUSH_ENABLED == 'true')) }}
        working-directory: tools/push
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.operation == 'validate' }}
          BASELINE_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.operation == 'baseline' }}
          TEST_MODE: ${{ github.event_name == 'workflow_dispatch' && (inputs.operation == 'test' || inputs.operation == 'test-basic') }}
          TEST_BASIC: ${{ github.event_name == 'workflow_dispatch' && inputs.operation == 'test-basic' }}
          TEST_SUBSCRIBER_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.subscriber_id || '' }}
          TEST_VIDEO_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.video_id || '' }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
