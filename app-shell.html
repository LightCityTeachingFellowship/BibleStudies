<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Opening LightCity</title>
<script>
(() => {
  const base = new URL({{ '/' | relative_url | jsonify }}, location.origin);
  const fallback = new URL('Home/', base);
  let destination = fallback;
  try {
    const requested = new URL(location.href).searchParams.get('page');
    if (requested) {
      const candidate = new URL(requested, base);
      const relative = candidate.pathname.slice(base.pathname.length).replace(/^\/+/, '');
      if (candidate.origin === base.origin && candidate.pathname.startsWith(base.pathname) &&
          !candidate.username && !candidate.password && !/^app(?:\/|$)/i.test(relative)) destination = candidate;
    }
  } catch {}
  location.replace(destination.href);
})();
</script></head><body><p>Opening LightCity…</p><a href="{{ '/Home/' | relative_url }}">Go to LightCity home</a></body></html>
