<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"><title>LightCity Studio alerts</title><link rel="stylesheet" href="alerts.css"><script defer src="alerts.js"></script></head><body>
<header><img src="assets/studio.png" alt="LightCity"><div><span class="eyebrow">LIGHTCITY STUDIO</span><h1>Your alerts</h1></div><button id="open">Open Studio</button></header>
<p id="status" role="status">Waiting for Studio…</p><main><section id="ready" hidden><h2>Ready to share</h2><p id="ready-title"></p><input id="ready-url" readonly aria-label="Ready share link"><div class="actions"><button id="copy" class="primary">Copy link</button><button id="dismiss">Clear ready alert</button></div></section><div id="reports"></div><p id="empty" hidden>No unresolved reports. New alerts will appear here.</p></main>
<details id="settings"><summary>Desktop settings</summary><label><input id="sound" type="checkbox"> Play an alert sound</label><label><input id="alwaysOnTop" type="checkbox"> Keep Studio above other windows</label><label><input id="openAtLogin" type="checkbox"> Start Studio with Windows</label><p>Closing Studio keeps it in the tray. Choose Quit from the tray menu to stop it.</p></details><footer><button id="retry">Reconnect / refresh</button><button id="hide">Hide panel</button><p>Reports stay here until handled. Changes are shared with your phone.</p></footer></body></html>
