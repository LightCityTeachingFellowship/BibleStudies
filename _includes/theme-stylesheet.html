<script>
(() => {
  let preference;
  try { preference = localStorage.getItem('theme'); } catch {}
  const dark = preference === 'darkMODE' ||
    (preference !== 'lightMODE' && matchMedia('(prefers-color-scheme: dark)').matches);
  const root = document.documentElement;
  root.toggleAttribute('data-lc-initial-dark', dark);
  if (dark) {
    const markBody = () => {
      if (!document.body) return;
      document.body.classList.add('darkmode');
      observer.disconnect();
    };
    const observer = new MutationObserver(markBody);
    observer.observe(root, {childList:true});
    markBody();
    window.addEventListener('DOMContentLoaded', () => root.removeAttribute('data-lc-initial-dark'), {once:true});
  }
  const href = dark ? {{ '/style/darkMODE.css' | relative_url | jsonify }} : {{ '/style/lightMODE.css' | relative_url | jsonify }};
  document.write('<link id="theme-stylesheet" rel="stylesheet" href="' + href + '">');
})();
</script>
<noscript><link rel="stylesheet" href="{{ '/style/lightMODE.css' | relative_url }}"></noscript>
