<button id="stream-report-open" type="button" class="lc-mode-button stream-report-open" hidden>Stream feedback &amp; questions</button>
    <dialog id="stream-report-dialog" class="stream-report-dialog" aria-labelledby="stream-report-title"><div class="stream-report-heading"><h2 id="stream-report-title">Stream feedback &amp; questions</h2><button id="stream-report-close" type="button" aria-label="Close report">×</button></div><form id="stream-report-form"><label for="stream-report-kind">What is happening?</label><select id="stream-report-kind"><option value="ended">The stream has ended</option><option value="volume">The speaker volume is too low</option><option value="no-sound">No sound</option><option value="message">Question, answer or other message</option></select><p id="stream-report-identity" class="muted"></p><div id="stream-report-name-row"><label for="stream-report-name">Your name</label><input id="stream-report-name" type="text" autocomplete="name" maxlength="80" required></div><div id="stream-report-message-row" hidden><label for="stream-report-message">Your question, answer or message</label><textarea id="stream-report-message" rows="5" maxlength="2000" placeholder="Type your message to the admin…"></textarea><p class="muted">Up to 2000 characters. Only the admin can read your message; this is not a public chat.</p></div><p class="muted">For an ended-stream report, we check the broadcast before alerting the admin. For audio problems, please check your device volume and mute setting first.</p><button id="stream-report-send" type="submit" class="lc-mode-button">Send report</button></form><p id="stream-report-status" role="status" aria-live="polite"></p><div class="stream-report-actions"><button id="stream-report-refresh" type="button" class="lc-mode-button" hidden>Refresh page</button><button id="stream-report-recheck" type="button" class="lc-mode-button" hidden>Check again</button></div></dialog>
