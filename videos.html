---
layout: videosTEMPLATE
permalink: /Videos/
title: "Videos"
---

<section id="homeBodyContent" class="homeBody-section">
    <div class="videos-container leftRight-space-16">
        <div class="homeResources-grid-containter bg-color videos-header">
            <h1 class="titles">LightCity Videos</h1>
            <a class="lc-personal-library-link" href="{{ '/MyLibrary/' | relative_url }}">Saved &amp; history →</a>
            <div id="video-category-tabs" class="videos-header-cont" data-public-only="{% if site.video_visibility_enabled == true %}true{% else %}false{% endif %}"{% if site.video_visibility_enabled == true %} hidden{% endif %}>
                <div class="videos-header-btns-cont">
                    <button id="All-Tab" class="videos-header-btns" title="All Videos" videoCategory-btn="All">All</button>
                    <button id="Sunday-Tab" class="videos-header-btns" title="Sunday Fellowship" videoCategory-btn="Sunday">Sunday Fellowship</button>
                    <button id="Meeting-Tab" class="videos-header-btns" title="Monday Prayer Meeting" videoCategory-btn="Meeting">Prayer Meeting</button>
                    <button id="Study-Tab" class="videos-header-btns" title="Bible Studies" videoCategory-btn="Study">Bible Study</button>
                    <button id="Program-Tab" class="videos-header-btns" title="Programs" videoCategory-btn="Program">Programs</button>
                    <button id="Excerpts-Tab" class="videos-header-btns" title="Video excerpts" videoCategory-btn="Excerpts">Excerpts</button>
                    <button id="Ceremonies-Tab" class="videos-header-btns" title="Ceremonies" videoCategory-btn="Ceremonies">Ceremonies</button>
                </div>
            </div>
        </div>
        <span class="lc-member-loading" role="status" aria-live="polite"><span class="lc-member-load-normal">Loading your library…</span><span class="lc-member-load-slow">Still loading your library. Check your connection or reload the page.</span></span>
        <div id="videotab-container" class="videotab-content-wrapper">
            <div id="All-Tab-content" class="videotab-content">      
            </div>
        </div>
        <script type="application/json" id="video-category-data">{% include video-list.html %}{ {% for video_id in visible_video_ids %}{% assign video = site.data.videos | where: 'id', video_id | first %}{{ video_id | jsonify }}:{{ video.category | jsonify }}{% unless forloop.last %},{% endunless %}{% endfor %} }</script>
        <script type="application/json" id="video-title-data">{ {% for video_id in visible_video_ids %}{% assign video = site.data.videos | where: 'id', video_id | first %}{{ video_id | jsonify }}:{{ video.title | jsonify | replace: '<', '\u003c' }}{% unless forloop.last %},{% endunless %}{% endfor %} }</script>
    </div>
</section>
